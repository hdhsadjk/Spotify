<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1ed760">
  <title>Premium 方案資訊</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #111; color: #f5f5f5;
      font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    .page { width: min(100%, 760px); margin: 0 auto; padding: 14px; }
    .brand-link, .promo-link { display: block; text-decoration: none; }
    .brand-link { margin: 0 0 14px; }
    .brand-link img, .promo-link img {
      display: block; width: 100%; height: auto; border-radius: 12px;
    }
    .notice {
      margin: 12px 2px 0; padding: 12px 14px; border-radius: 10px;
      background: #262626; color: #ddd; font-size: 13px; line-height: 1.6;
      text-align: center;
    }
    .cta {
      display: block; margin: 14px 0 4px; padding: 16px 20px;
      border-radius: 999px; background: #1ed760; color: #101010;
      font-weight: 700; font-size: 18px; text-align: center;
      text-decoration: none;
    }
    .cta:focus-visible, .brand-link:focus-visible, .promo-link:focus-visible {
      outline: 3px solid #fff; outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="brand-link" href="https://lin.ee/vhUsNal" target="_blank" rel="noopener noreferrer" aria-label="開啟活動連結">
      <img src="spotify-logo.png" alt="Spotify 標誌">
    </a>
    <a class="promo-link" href="https://lin.ee/vhUsNal" target="_blank" rel="noopener noreferrer" aria-label="立即領取會員，開啟活動連結">
      <img src="spotify-promo.png" alt="Premium 方案圖片：前三個月 $0，之後每月 $168；優惠期限與資格請以官方資訊為準">
    </a>
    <a class="cta" href="https://lin.ee/vhUsNal" target="_blank" rel="noopener noreferrer">立即領取會員</a>
    <p class="notice">為 Spotify 官方網站或官方活動頁。此頁僅作資訊導覽；方案資格、價格及期限請以 Spotify 優惠客戶為準。點擊將前往 領取 頁面。</p>
  </main>
</body>
</html>
